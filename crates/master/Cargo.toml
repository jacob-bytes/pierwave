[package]
name = "pierwave-master"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pierwave-master"
path = "src/main.rs"

[dependencies]
pierwave-domain = { path = "../domain" }
pierwave-proto = { path = "../proto" }
anyhow = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
chrono = { workspace = true }
flate2 = { workspace = true }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
time = "0.3"
# P16 隧道：主控自签 CA + 每台服务器一张属证书。
# 只启用 ring 后端与 PEM 输出，避免把 aws-lc 带进 musl 静态构建；
# 新增的体积主要是 ring（master 之前没有直接依赖它，但 rustls 已经在
# workspace 里用了同一个 ring 版本，最终二进制增量约数百 KB）。
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[dev-dependencies]
base64 = { workspace = true }
