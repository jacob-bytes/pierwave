[package]
name = "pierwave-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pierwave-agent"
path = "src/main.rs"

[dependencies]
pierwave-domain = { path = "../domain" }
pierwave-proto = { path = "../proto" }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tower-http = { workspace = true }
# P17 网卡绑定：`if-addrs` 只是 getifaddrs 的薄封装，不引入 tokio/rustls 那类大依赖。
# 体积实测（release + strip + thin LTO，同一台机器，macOS x86_64）：去掉依赖并让
# `network::collect()` 返回空数组后是 7,270,192 字节，恢复后是 7,270,624 字节，
# 即 **+432 字节**（约 +0.006%）。
if-addrs = "0.13"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
futures-util = "0.3"
rustls = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
# P16.1 隧道：proof = HMAC-SHA256，CA/证书 PEM 解码走 base64。
# 三者都已在 workspace 依赖里（domain/master 已在用），没有引入新 crate。
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
# P16.2 Noise/PSK：Noise 协议实现（IK handshake + ChaChaPoly/BLAKE2s）。
# 体积影响见 crates/agent/README 或 PR 说明：默认 resolver 会带入
# chacha20poly1305 / aes-gcm / curve25519-dalek 等纯 Rust crate。
snow = "0.9"
# P16.3 UDP over QUIC：QUIC datagram 中继（不把 UDP 塞进 TCP 流）。
# 只用 ring 后端：workspace 的 rustls 已经固定 ring（default-features=false +
# ["ring"]），quinn 的 `rustls-ring` 与它共用同一份 ring/provider；**不启用**
# `rustls-aws-lc-rs` / `aws-lc-rs`，不引入 aws-lc（musl 静态构建负担）。
# 体积影响（release, strip + thin LTO，同一台机器实测）：pierwave-agent
# 6,008,272 → 6,782,336 字节（+774,064 字节 / +756 KiB / +12.9%）。新增的
# 只有 quinn / quinn-proto / quinn-udp 等 crate，**没有 aws-lc**；详见 PR 说明。
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
    "log",
] }
# P16.3 Noise + UDP：QUIC 只能走 TLS 1.3，所以由 hop_secret 确定性派生一张
# ed25519 自签证书、客户端固定指纹（见 `tunnel/pinned.rs`）。rcgen 已经是
# master 的依赖，`yasna` / `time` / `ring` 都在现有依赖图里；agent 侧新增的
# 只有 rcgen 本身的代码。**不启用** `pem`（只输出 DER），也不启用 aws-lc。
# 体积实测（release + strip + thin LTO，同一台机器）：pierwave-agent
# 7,320,208 → 7,438,208 字节（+118,000 字节 / +115.2 KiB / +1.6%）。
rcgen = { version = "0.14", default-features = false, features = ["ring"] }

[dev-dependencies]
ed25519-dalek = { workspace = true }
hex = { workspace = true }
