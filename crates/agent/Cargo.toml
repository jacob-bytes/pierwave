[package]
name = "pierwave-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pierwave-agent"
path = "src/main.rs"

[dependencies]
pierwave-domain = { path = "../domain" }
pierwave-proto = { path = "../proto" }
anyhow = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
futures-util = "0.3"
rustls = { workspace = true }
tokio-rustls = { workspace = true }
webpki-roots = { workspace = true }
# P16.1 隧道：proof = HMAC-SHA256，CA/证书 PEM 解码走 base64。
# 三者都已在 workspace 依赖里（domain/master 已在用），没有引入新 crate。
hmac = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
# P16.2 Noise/PSK：Noise 协议实现（IK handshake + ChaChaPoly/BLAKE2s）。
# 体积影响见 crates/agent/README 或 PR 说明：默认 resolver 会带入
# chacha20poly1305 / aes-gcm / curve25519-dalek 等纯 Rust crate。
snow = "0.9"

[dev-dependencies]
ed25519-dalek = { workspace = true }
hex = { workspace = true }
