<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>概念 C · 品牌化落地页 · PierWave 服务状态</title>
<!--
  概念 C：品牌化落地页 / Concept C — Brand landing page.

  静态原型，无网络请求。首屏是一句状态结论 + 一行近 24 小时趋势；
  卡片更大、留白更多，卡片内部按「状况 / 资源 / 网络」分区。
  `?state=offline|error|disabled`、`?theme=light` 同 a.html。

  数据缺口：趋势里的「总速率」需要新字段（见 README）；
  「在线节点数」可以由现有 buckets_24h 在浏览器里聚合，不需要新接口。
-->
<style>
@font-face {
  font-family: "Geist Variable";
  src: url("../../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2") format("woff2-variations");
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}

:root {
  color-scheme: dark;
  --background: oklch(0.145 0.004 285);
  --foreground: oklch(0.965 0.003 285);
  --card: oklch(0.175 0.005 285);
  --popover: oklch(0.195 0.005 285);
  --primary: oklch(0.662 0.179 264.6);
  --primary-foreground: oklch(0.182 0.013 264.2);
  --secondary: oklch(0.24 0.006 285);
  --muted: oklch(0.225 0.005 285);
  --muted-foreground: oklch(0.7 0.015 285);
  --accent: oklch(0.245 0.006 285);
  --destructive: oklch(0.62 0.2 25);
  --warning: oklch(0.82 0.16 80);
  --border: oklch(1 0 0 / 8%);
  --input: oklch(1 0 0 / 12%);
  --ring: oklch(0.662 0.179 264.6);
  --focus-ring: oklch(0.74 0.16 264.6);
  --radius: 0.75rem;
  --card-shadow: inset 0 1px 0 rgb(255 255 255 / 0.045), 0 1px 2px rgb(0 0 0 / 0.35);
  --card-ring: color-mix(in oklab, var(--foreground) 10%, transparent);
}
[data-theme="light"] {
  color-scheme: light;
  --background: oklch(0.979 0.003 264.5);
  --foreground: oklch(0.253 0.03 267.4);
  --card: oklch(1 0 0);
  --popover: oklch(1 0 0);
  --primary: oklch(0.424 0.199 265.638);
  --primary-foreground: oklch(1 0 0);
  --secondary: oklch(0.967 0.006 264.5);
  --muted: oklch(0.964 0.006 264.5);
  --muted-foreground: oklch(0.52 0.035 265.1);
  --accent: oklch(0.964 0.017 267.8);
  --destructive: oklch(0.57 0.208 25.3);
  --warning: oklch(0.53 0.146 49);
  --border: oklch(0.94 0.009 264.5);
  --input: oklch(0.94 0.009 264.5);
  --ring: oklch(0.424 0.199 265.638);
  --focus-ring: oklch(0.42 0.2 265.6);
  --card-shadow: 0 1px 2px oklch(0.253 0.03 267.4 / 6%), 0 4px 12px oklch(0.253 0.03 267.4 / 4%);
  --card-ring: color-mix(in oklab, var(--foreground) 10%, transparent);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100dvh;
  background: var(--background);
  color: var(--foreground);
  font-family: "Geist Variable", ui-sans-serif, system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 14px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; }
.tnum { font-variant-numeric: tabular-nums; }
.icon { width: 16px; height: 16px; flex: none; display: block; }
.icon-sm { width: 14px; height: 14px; }
.icon-lg { width: 20px; height: 20px; }
.sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 24px; }
.page { display: flex; flex-direction: column; min-height: 100dvh; }

/* ---------- 导航 ---------- */
.nav { border-bottom: 1px solid var(--border); background: color-mix(in oklab, var(--card) 80%, var(--background)); }
.nav-in { display: flex; align-items: center; gap: 12px; height: 72px; }
.brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
.brand-logo { width: 40px; height: 40px; border-radius: 12px; flex: none; display: grid; place-items: center; background: var(--primary); color: var(--primary-foreground); }
.brand-text { display: flex; min-width: 0; flex-direction: column; justify-content: center; }
.brand-name { font-size: 16px; font-weight: 600; letter-spacing: -.015em; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-tagline { font-size: 11.5px; line-height: 1.35; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.live { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted-foreground); white-space: nowrap; }
.live .dot { width: 6px; height: 6px; }
.btn-ghost { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 10px; border-radius: 8px; font-size: 12.5px; color: var(--foreground); white-space: nowrap; transition: background-color 120ms ease-out; }
.btn-ghost:hover { background: var(--muted); }
.btn-icon { width: 34px; padding: 0; }

/* ---------- 状态点 / 可用率 ---------- */
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; flex: none; }
.dot.online { background: var(--primary); box-shadow: 0 0 0 2px color-mix(in oklab, var(--primary) 25%, transparent); }
.dot.offline { background: transparent; border: 1.5px solid color-mix(in oklab, var(--muted-foreground) 70%, transparent); }
.dot.abnormal { background: var(--destructive); box-shadow: 0 0 0 2px color-mix(in oklab, var(--destructive) 25%, transparent); }
.dot.warn { background: var(--warning); }

.av { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
.av > b { font-weight: 500; font-variant-numeric: tabular-nums; }
.av-ok > b { color: var(--foreground); }
.av-warn > b { color: var(--warning); }
.av-down > b { color: var(--destructive); }
.av-unknown > b { color: var(--muted-foreground); }
.mini { display: block; width: 56px; height: 3px; flex: none; overflow: hidden; border-radius: 999px; background: color-mix(in oklab, var(--muted-foreground) 20%, transparent); }
.mini > i { display: block; height: 100%; border-radius: 999px; }
.bar-ok { background: var(--primary); }
.bar-warn { background: var(--warning); }
.bar-down { background: var(--destructive); }
.bar-unknown { background: color-mix(in oklab, var(--muted-foreground) 65%, transparent); }

/* ---------- 首屏 ---------- */
.hero { padding: 56px 0 34px; }
.verdict { display: flex; align-items: flex-start; gap: 12px; }
.verdict > .dot { width: 10px; height: 10px; margin-top: 13px; }
.verdict h1 { font-size: 34px; line-height: 1.3; font-weight: 600; letter-spacing: -.025em; }
.hero-sub { margin-top: 10px; padding-left: 22px; font-size: 13px; line-height: 1.6; color: var(--muted-foreground); }
.hero-sub .down { color: var(--destructive); }
.hero-stats { margin-top: 30px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stat { min-width: 0; padding: 0 24px; border-left: 1px solid var(--border); }
.stat:first-child { border-left: 0; padding-left: 0; }
.stat-label { font-size: 11px; letter-spacing: .01em; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-value { margin-top: 2px; font-size: 27px; line-height: 1.25; font-weight: 500; letter-spacing: -.025em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-value .unit { margin-left: 3px; font-size: 12px; font-weight: 400; letter-spacing: 0; color: var(--muted-foreground); }
.stat-value.text { font-size: 15px; font-weight: 500; letter-spacing: -.005em; line-height: 1.55; padding-top: 5px; }
.stat-value.is-empty { color: var(--muted-foreground); }
.stat-foot { margin-top: 2px; font-size: 11px; line-height: 1.4; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat-foot .down { color: var(--destructive); }

/* ---------- 趋势卡 ---------- */
.trend { margin-top: 10px; padding: 18px 24px 14px; border: 1px solid var(--card-ring); border-radius: 12px; background: var(--card); box-shadow: var(--card-shadow); }
.trend-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.trend-title { font-size: 13.5px; font-weight: 600; letter-spacing: -.005em; }
.trend-legend { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: 11px; color: var(--muted-foreground); white-space: nowrap; }
.trend-legend > span { display: inline-flex; align-items: center; gap: 6px; }
.trend-legend i { display: block; width: 12px; height: 6px; border-radius: 2px; }
.trend-legend .line { width: 14px; height: 2px; border-radius: 999px; background: var(--muted-foreground); }
.trend-head .scale { margin-left: auto; font-size: 10.5px; color: var(--muted-foreground); }
.trend-rows { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
.trend-row { display: grid; grid-template-columns: 60px minmax(0, 1fr) 84px; gap: 10px; align-items: center; }
.trend-row-label { font-size: 10.5px; line-height: 1.4; color: var(--muted-foreground); white-space: nowrap; }
.trend-row-now { font-size: 11px; line-height: 1.4; text-align: right; color: var(--foreground); font-variant-numeric: tabular-nums; white-space: nowrap; }
.trend-dots { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; height: 4px; }
.trend-dots > i { display: block; height: 100%; border-radius: 1px; background: var(--primary); opacity: .9; }
.trend-dots > i.off { background: color-mix(in oklab, var(--muted-foreground) 50%, transparent); opacity: 1; }
.trend-bars { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; height: 58px; align-items: end; border-bottom: 1px solid var(--border); }
.trend-bars > i { display: block; width: 100%; border-radius: 2px 2px 0 0; background: var(--primary); opacity: .82; min-height: 2px; }
.trend-axis { margin-top: 6px; display: grid; grid-template-columns: 60px minmax(0, 1fr) 84px; gap: 10px; font-size: 10px; color: var(--muted-foreground); }
.trend-axis > span { grid-column: 2; display: flex; justify-content: space-between; }
.trend-foot { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 11px; color: var(--muted-foreground); }
.trend-foot .right { margin-left: auto; white-space: nowrap; }

/* ---------- 控件 ---------- */
.controls { margin-top: 30px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.chips { display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--border); border-radius: 999px; font-size: 12px; color: var(--muted-foreground); white-space: nowrap; transition: color 120ms ease-out, border-color 120ms ease-out, background-color 120ms ease-out; }
.chip:hover { color: var(--foreground); }
.chip[aria-pressed="true"] { color: var(--primary); border-color: color-mix(in oklab, var(--primary) 55%, transparent); background: color-mix(in oklab, var(--primary) 8%, transparent); }
.chip .count { min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--muted); color: var(--foreground); font-size: 10px; line-height: 16px; text-align: center; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] .count { background: color-mix(in oklab, var(--primary) 15%, transparent); color: var(--primary); }
.tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; align-items: center; gap: 2px; height: 32px; padding: 2px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }
.seg > button { display: inline-flex; align-items: center; justify-content: center; gap: 5px; height: 26px; padding: 0 8px; border-radius: 6px; font-size: 12px; color: var(--muted-foreground); white-space: nowrap; transition: background-color 120ms ease-out, color 120ms ease-out; }
.seg > button:hover { color: var(--foreground); }
.seg > button[aria-pressed="true"] { background: var(--accent); color: var(--primary); font-weight: 500; }
.seg > button > .count { font-size: 10px; line-height: 16px; }
.seg.view > button { width: 28px; padding: 0; }
.search { position: relative; display: flex; align-items: center; height: 32px; }
.search .icon { position: absolute; left: 9px; color: var(--muted-foreground); pointer-events: none; }
.search input { width: 196px; height: 32px; padding: 0 28px 0 29px; border: 1px solid var(--input); border-radius: 8px; background: var(--card); font-size: 12px; outline: none; transition: border-color 120ms ease-out, box-shadow 120ms ease-out; }
.search input::placeholder { color: var(--muted-foreground); }
.search input:focus { border-color: var(--ring); box-shadow: 0 0 0 2px color-mix(in oklab, var(--ring) 30%, transparent); }

.legend { margin-top: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; font-size: 10.5px; color: var(--muted-foreground); }
.legend > span { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.legend i { display: block; width: 14px; height: 5px; border-radius: 2px; }

/* ---------- 卡片 ---------- */
.cards { margin-top: 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.card { min-width: 0; padding: 24px; border: 1px solid var(--card-ring); border-radius: 12px; background: var(--card); box-shadow: var(--card-shadow); display: flex; flex-direction: column; }
.card.is-offline { background: color-mix(in oklab, var(--muted) 40%, var(--card)); }
.card-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.card-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
.card-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16.5px; font-weight: 600; letter-spacing: -.015em; line-height: 1.35; }
.flag { flex: none; font-size: 15px; line-height: 1; }
.pill { margin-left: auto; flex: none; display: inline-flex; align-items: center; gap: 5px; height: 23px; padding: 0 8px; border: 1px solid var(--border); border-radius: 999px; background: var(--card); font-size: 10.5px; line-height: 1; color: var(--foreground); white-space: nowrap; }
.pill.offline { color: var(--muted-foreground); }
.card-meta { margin-top: 7px; font-size: 11.5px; line-height: 1.5; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-spec { margin-top: 1px; font-size: 11.5px; line-height: 1.5; color: var(--muted-foreground); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.zone { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
.zone-label { font-size: 10px; letter-spacing: .08em; color: var(--muted-foreground); }
.status-grid { margin-top: 9px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.big-av { min-width: 0; }
.big-av-label { display: block; font-size: 11px; line-height: 1.4; color: var(--muted-foreground); }
.big-av-value { margin-top: 1px; display: flex; align-items: baseline; gap: 10px; }
.big-av-value b { font-size: 24px; line-height: 1.25; font-weight: 500; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.big-av-value b.tone-warn { color: var(--warning); }
.big-av-value b.tone-down { color: var(--destructive); }
.big-av-value b.tone-unknown { color: var(--muted-foreground); }
.big-av-value .mini { width: 68px; height: 4px; }
.strip-block { margin-top: 14px; }
.strip { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; height: 7px; }
.strip > i { display: block; height: 100%; border-radius: 2px; }
.strip-axis { margin-top: 6px; display: flex; justify-content: space-between; font-size: 9.5px; color: var(--muted-foreground); }

.res-grid { margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.res { min-width: 0; }
.res-label { font-size: 11px; line-height: 1.4; color: var(--muted-foreground); }
.res-value { margin-top: 1px; font-size: 17px; line-height: 1.35; font-weight: 500; letter-spacing: -.015em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.res-value .unit { font-size: 11px; font-weight: 400; letter-spacing: 0; color: var(--muted-foreground); margin-left: 2px; }
.res-bar { margin-top: 7px; height: 3px; border-radius: 999px; overflow: hidden; background: color-mix(in oklab, var(--muted-foreground) 20%, transparent); }
.res-bar > i { display: block; height: 100%; border-radius: 999px; }
.res-foot { margin-top: 5px; font-size: 10.5px; line-height: 1.4; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-variant-numeric: tabular-nums; }

.net-grid { margin-top: 9px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.net-label { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; line-height: 1.4; color: var(--muted-foreground); }
.net-label .icon { width: 11px; height: 11px; }
.net-value { margin-top: 1px; font-size: 18px; line-height: 1.35; font-weight: 500; letter-spacing: -.015em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.net-value.muted { color: var(--muted-foreground); font-weight: 400; }
.net-foot { margin-top: 3px; font-size: 10.5px; line-height: 1.4; color: var(--muted-foreground); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- 页脚 ---------- */
.foot { margin-top: 44px; border-top: 1px solid var(--border); padding: 22px 0 44px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; font-size: 11px; color: var(--muted-foreground); }
.foot .brandline { display: inline-flex; align-items: center; gap: 7px; color: var(--foreground); font-size: 12px; }
.foot .brandline .dot { width: 5px; height: 5px; background: var(--primary); }
.foot .right { margin-left: auto; display: flex; flex-wrap: wrap; gap: 14px; }
.foot a { color: var(--muted-foreground); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.foot a:hover { color: var(--foreground); }

/* ---------- 错误 / 关闭 ---------- */
.error-hero { padding: 80px 0 0; flex: 1; display: flex; flex-direction: column; }
.error-hero .foot { margin-top: auto; }
.error-hero .panel-icon { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: color-mix(in oklab, var(--destructive) 10%, transparent); color: var(--destructive); }
.error-hero h1 { margin-top: 18px; font-size: 32px; line-height: 1.3; font-weight: 600; letter-spacing: -.025em; }
.error-hero p { margin-top: 10px; max-width: 520px; font-size: 13.5px; line-height: 1.7; color: var(--muted-foreground); }
.error-hero .actions { margin-top: 22px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 8px; font-size: 12.5px; background: var(--primary); color: var(--primary-foreground); font-weight: 500; transition: opacity 120ms ease-out; }
.btn:hover { opacity: .9; }
.btn-outline { background: transparent; color: var(--foreground); border: 1px solid var(--border); font-weight: 400; }
.hint { font-size: 11px; color: var(--muted-foreground); }
.empty-state { flex: 1; display: flex; flex-direction: column; }
.empty-state .empty-body { flex: 1; display: grid; place-items: center; padding: 64px 0 80px; }
.empty-state .foot { margin-top: auto; }
.empty-panel { max-width: 440px; text-align: center; }
.empty-panel .panel-icon { margin: 0 auto; width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--muted); color: var(--muted-foreground); }
.empty-panel h2 { margin-top: 14px; font-size: 20px; font-weight: 600; letter-spacing: -.015em; }
.empty-panel p { margin-top: 6px; font-size: 12.5px; line-height: 1.6; color: var(--muted-foreground); }
.empty-panel .actions { margin-top: 18px; display: flex; justify-content: center; }

[data-theme="light"] .theme-btn .icon-sun { display: block; }
[data-theme="light"] .theme-btn .icon-moon { display: none; }
.theme-btn .icon-sun { display: none; }

@media (max-width: 960px) {
  .cards { grid-template-columns: 1fr; }
  .hero { padding-top: 44px; }
  .verdict h1 { font-size: 30px; }
  .stat { padding: 0 16px; }
  .stat-value { font-size: 24px; }
}
@media (max-width: 720px) {
  .wrap { padding: 0 16px; }
  .nav-in { height: 60px; }
  .brand-logo { width: 34px; height: 34px; border-radius: 10px; }
  .brand-name { font-size: 15px; }
  .brand-tagline { display: none; }
  .live-text { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .hero { padding: 32px 0 24px; }
  .verdict > .dot { margin-top: 10px; width: 8px; height: 8px; }
  .verdict h1 { font-size: 25px; letter-spacing: -.02em; }
  .hero-sub { margin-top: 8px; padding-left: 18px; font-size: 12px; }
  .hero-stats { margin-top: 22px; grid-template-columns: 1fr 1fr; row-gap: 0; }
  .stat { padding: 12px 14px; border-left: 0; }
  .stat:nth-child(odd) { padding-left: 0; }
  .stat:nth-child(even) { border-left: 1px solid var(--border); }
  .stat:nth-child(n + 3) { border-top: 1px solid var(--border); }
  .stat-value { font-size: 22px; }
  .stat-value.text { font-size: 13px; padding-top: 4px; }

const params = new URLSearchParams(location.search);
const STATE = params.get("state") || "normal";
if (params.get("theme") === "light") document.documentElement.dataset.theme = "light";

const pct = (r) => (r === null || r === undefined || !Number.isFinite(r) ? "—" : Math.round(Math.min(1, Math.max(0, r)) * 100) + "%");
const fill = (r) => (r === null || r === undefined || !Number.isFinite(r) ? 0 : Math.round(Math.min(1, Math.max(0, r)) * 100));
const tone = (r) => (r === null || r === undefined || !Number.isFinite(r) ? "unknown" : r >= 0.99 ? "ok" : r >= 0.95 ? "warn" : "down");
const st = (s) => (!s.online ? "offline" : s.xray === false ? "abnormal" : "online");
const statusText = (k) => (k === "online" ? "在线" : k === "offline" ? "离线" : "异常");
const stripClass = (v) => (v === null ? "bar-unknown" : v >= 0.99 ? "bar-ok" : v >= 0.95 ? "bar-warn" : "bar-down");
const specLine = (s) => [s.os, s.virt, s.arch].filter(Boolean).join(" · ");
const avg = (list) => {
  const nums = list.map((s) => s.uptime24h).filter((v) => typeof v === "number" && Number.isFinite(v));
  return nums.length ? nums.reduce((a, b) => a + b, 0) / nums.length : null;
};
const sum = (list, key) => list.reduce((acc, s) => acc + (s.online && typeof s[key] === "number" ? s[key] : 0), 0);

function serversForState() {
  if (STATE === "offline") {
    return FIXTURES.map((s) => ({ ...s, online: false, xray: null, uptime: null, lastSeen: "3 小时前", latency: null, load: null, rx: null, tx: null, rxSum: 0, txSum: 0, buckets: s.buckets.map((v, i) => (i >= 21 ? 0 : v)) }));
  }
  return FIXTURES;
}

/* 近 24 小时趋势：在线节点数（可由现有 buckets_24h 聚合）与总速率（需要新字段）。 */
function trendData() {
  // 在线节点数：由 fixture 的 buckets_24h 聚合（与现网可用的数据同构）。
  const servers = serversForState();
  const counts = Array.from({ length: 24 }, (_, i) =>
    servers.filter((s) => (s.buckets[i] ?? 0) >= 0.99).length,
  );
  // 总速率：概念数据；现网需要新增 rate_24h，见 README。
  const rates = [14, 13, 12, 11, 10, 9, 8, 9, 11, 14, 19, 24, 28, 31, 33, 36, 35, 32, 29, 26, 23, 28, 34, 41];
  if (STATE === "offline") {
    return { counts, rates: rates.map((_, i) => (i >= 21 ? 0 : rates[i])) };
  }
  return { counts, rates };
}

const icon = (name, cls = "") => `<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const dot = (state) => `<span class="dot ${state}" aria-hidden="true"></span>`;

function availability(ratio, { size = 12, bar = 56 } = {}) {
  const t = tone(ratio);
  return `<span class="av av-${t}"><b style="font-size:${size}px">${pct(ratio)}</b><span class="mini" style="width:${bar}px" aria-hidden="true"><i class="bar-${t}" style="width:${fill(ratio)}%;${fill(ratio) > 0 ? "min-width:2px" : ""}"></i></span></span>`;
}

function hourStrip(buckets) {
  return `<div class="strip" role="img" aria-label="近 24 小时可用率，每格 1 小时">${buckets

}

function statusPill(s) {
  const state = st(s);
  return `<span class="pill ${state}"${state === "abnormal" ? ' title="Agent 在线，但 Xray 未运行"' : ""}>${dot(state)}${statusText(state)}</span>`;

function trendBand() {

  const dots = counts.map((c, i) => `<i class="${c >= total ? "" : "off"}" title="${24 - i} 小时前 · ${c} / ${total} 台在线"></i>`).join("");

      <span class="trend-row-label">在线节点</span>

function hero(servers) {

        <div class="stat-label">最忙服务器</div>
        <div class="stat-value text">${busy ? busy.name : "—"}</div>

      </div>
    </div>
  </section>`;
}

      </div>
      <label class="search">${icon("search")}<input type="search" placeholder="搜索服务器" aria-label="按名称搜索服务器"></label>
      <div class="seg view" role="group" aria-label="切换视图">
        <button type="button" aria-pressed="true" aria-label="网格视图" title="网格视图">${icon("grid", "icon-sm")}</button>
        <button type="button" aria-pressed="false" aria-label="列表视图" title="列表视图">${icon("list", "icon-sm")}</button>
      </div>
    </div>
  </div>
  <div class="legend" aria-label="可用率图例">
    <span><i class="bar-ok"></i>正常 ≥99%</span>
    <span><i class="bar-warn"></i>可用性下降 95–99%</span>
    <span><i class="bar-down"></i>可用性不足 &lt;95%</span>
    <span><i class="bar-unknown"></i>无数据</span>
  </div>`;
}

function card(s) {
  const state = st(s);
  const online = state !== "offline";
  const memPct = s.mem[1] > 0 ? Math.round((s.mem[0] / s.mem[1]) * 100) : null;
  const diskPct = s.disk[1] > 0 ? Math.round((s.disk[0] / s.disk[1]) * 100) : null;
  const meta = online
    ? `${s.countryName} · ${s.group} · 已在线 ${s.uptime}`
    : `${s.countryName} · ${s.group} · 最后心跳 ${s.lastSeen}`;

  return `<article class="card${online ? "" : " is-offline"}">
    <div class="card-head">
      <div class="card-title">
        <h3 class="card-name" title="${s.name}">${s.name}</h3>
        <span class="flag" role="img" aria-label="${s.countryName}">${s.flag}</span>
      </div>
      ${statusPill(s)}
    </div>
    <p class="card-meta" title="${meta}">${meta}</p>
    <p class="card-spec" title="${specLine(s)}">${specLine(s)}</p>

    <div class="zone">
      <div class="zone-label">状况</div>
      <div class="status-grid">
        <div class="big-av">
          <span class="big-av-label">24h 可用率</span>
          <span class="big-av-value"><b class="${tone(s.uptime24h) === "ok" ? "" : "tone-" + tone(s.uptime24h)}">${pct(s.uptime24h)}</b><span class="mini" aria-hidden="true"><i class="bar-${tone(s.uptime24h)}" style="width:${fill(s.uptime24h)}%;${fill(s.uptime24h) > 0 ? "min-width:2px" : ""}"></i></span></span>
        </div>
        <div class="big-av">
          <span class="big-av-label">7 天可用率</span>
          <span class="big-av-value"><b class="${tone(s.uptime7d) === "ok" ? "" : "tone-" + tone(s.uptime7d)}">${pct(s.uptime7d)}</b><span class="mini" aria-hidden="true"><i class="bar-${tone(s.uptime7d)}" style="width:${fill(s.uptime7d)}%;${fill(s.uptime7d) > 0 ? "min-width:2px" : ""}"></i></span></span>
        </div>
      </div>
      <div class="strip-block">
        ${hourStrip(s.buckets)}
        <div class="strip-axis"><span>24 小时前</span><span>现在</span></div>
      </div>
    </div>

    <div class="zone">
      <div class="zone-label">资源</div>
      <div class="res-grid">
        <div class="res">
          <div class="res-label">负载</div>
          <div class="res-value">${s.load === null ? "—" : s.load.toFixed(2)}</div>
          <div class="res-bar" aria-hidden="true" style="visibility:hidden"></div>
          <div class="res-foot">${s.load === null ? "未上报" : "1 分钟平均"}</div>
        </div>
        <div class="res">
          <div class="res-label">内存</div>
          <div class="res-value">${memPct === null ? "—" : memPct + "<span class='unit'>%</span>"}</div>
          <div class="res-bar" role="progressbar" aria-label="内存" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${memPct ?? 0}"><i class="bar-ok" style="width:${memPct ?? 0}%"></i></div>
          <div class="res-foot">${memPct === null ? "未上报" : s.mem[0] + " GB / " + s.mem[1] + " GB"}</div>
        </div>
        <div class="res">
          <div class="res-label">硬盘</div>
          <div class="res-value">${diskPct === null ? "—" : diskPct + "<span class='unit'>%</span>"}</div>
          <div class="res-bar" role="progressbar" aria-label="硬盘" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${diskPct ?? 0}"><i class="bar-ok" style="width:${diskPct ?? 0}%"></i></div>
          <div class="res-foot">${diskPct === null ? "未上报" : s.disk[0] + " GB / " + s.disk[1] + " GB"}</div>
        </div>
      </div>
    </div>

    <div class="zone">
      <div class="zone-label">网络</div>
      <div class="net-grid">
        <div>
          <div class="net-label">${icon("down")}下行</div>
          <div class="net-value${s.rx ? "" : " muted"}">${s.rx ?? "—"}</div>
          <div class="net-foot">累计 ${s.rxTotal}</div>
        </div>
        <div>
          <div class="net-label">${icon("up")}上行</div>
          <div class="net-value${s.tx ? "" : " muted"}">${s.tx ?? "—"}</div>
          <div class="net-foot">累计 ${s.txTotal}</div>
        </div>
        <div>
          <div class="net-label">延迟</div>
          <div class="net-value${online && s.latency !== null ? "" : " muted"}">${online && s.latency !== null ? s.latency + '<span class="unit"> ms</span>' : "—"}</div>
          <div class="net-foot">TCP 握手 RTT</div>
        </div>
      </div>
    </div>
  </article>`;
}

function foot({ liveBad = false, closed = false } = {}) {
  return `<footer class="foot">
    <span class="brandline">PierWave · 服务状态</span>
    <span>${closed ? "公开状态页已关闭" : liveBad ? "连接中断 · 每 30 秒自动重试" : "公开状态页 · 每 30 秒自动刷新"}</span>
    <span class="right">${liveBad ? "" : `<span>更新于 ${NOW_TEXT}</span>`}<a href="#" onclick="return false">进入管理面板 ${icon("right", "icon-sm")}</a></span>
  </footer>`;
}

function errorView() {
  return `<main class="wrap error-hero" role="alert">
    <div class="panel-icon">${icon("alert", "icon-lg")}</div>
    <h1>暂时无法获取状态</h1>
    <p>连接中断，请检查网络后重试。页面每 30 秒会自动重试一次。</p>
    <div class="actions">
      <button class="btn" type="button">${icon("refresh", "icon-sm")}重试</button>
      <span class="hint">上次成功更新：19:16:02</span>
    </div>
    ${foot({ liveBad: true })}
  </main>`;
}

function disabledView() {
  return `<main class="wrap empty-state">
    <div class="empty-body"><div class="empty-panel" role="status">
      <div class="panel-icon">${icon("shield", "icon-lg")}</div>
      <h2>状态页已关闭</h2>
      <p>管理员已关闭公开状态页。登录后可在设置里重新开启。</p>
      <div class="actions"><button class="btn btn-outline" type="button">进入后台 ${icon("right", "icon-sm")}</button></div>
    </div></div>
    ${foot({ closed: true })}
  </main>`;
}

function render() {
  const app = document.getElementById("app");
  if (STATE === "error") {
    app.innerHTML = `<div class="page">${nav({ liveBad: true })}${errorView()}</div>`;
    return;
  }
  if (STATE === "disabled") {
    app.innerHTML = `<div class="page">${nav({ closed: true })}${disabledView()}</div>`;
    return;
  }
  const servers = serversForState();
  app.innerHTML = `<div class="page">
    ${nav()}
    <main class="wrap">
      ${hero(servers)}
      ${trendCard()}
      ${controls(servers)}
      <section class="cards" aria-label="服务器">${servers.map(card).join("")}</section>
      ${foot()}
    </main>
  </div>`;
}

render();

document.querySelector(".theme-btn")?.addEventListener("click", () => {
  const root = document.documentElement;
  if (root.dataset.theme === "light") delete root.dataset.theme;
  else root.dataset.theme = "light";
});

document.documentElement.dataset.ready = "1";
</script>
</body>
</html>
