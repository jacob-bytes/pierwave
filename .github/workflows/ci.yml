name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 Makefile 保持一致：缓存落在仓库内，方便 actions/cache 命中
  CARGO_HOME: ${{ github.workspace }}/.cargo-home
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache

jobs:
  check:
    name: fmt + clippy + test + web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: .npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Frontend deps
        run: make web-install

      # 拆成独立 step：CI 上失败时能一眼看出是哪一环，不用翻日志
      - name: Format
        run: make fmt-check

      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --quiet --message-format=short -- -D warnings 2>&1 | tee clippy.log

      # GitHub 的 job 日志要仓库权限才能下载，但 annotation 是公开的。
      # 把失败输出打成 annotation，主控（或任何没有权限的人）也能看到具体错误。
      - name: Clippy errors as annotations
        if: failure()
        run: |
          head -20 clippy.log | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
          exit 0

      - name: Tests
        run: make test

      - name: Web build
        run: make web-build

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: End-to-end smoke
        run: |
          set -o pipefail
          ./scripts/e2e.sh 2>&1 | tee e2e.log

      - name: E2E errors as annotations
        if: failure()
        run: |
          tail -30 e2e.log | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
          exit 0
