name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 Makefile 保持一致：缓存落在仓库内，方便 actions/cache 命中
  CARGO_HOME: ${{ github.workspace }}/.cargo-home
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache

jobs:
  check:
    name: fmt + clippy + test + web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: .npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Frontend deps
        run: make web-install

      # 拆成独立 step：CI 上失败时能一眼看出是哪一环，不用翻日志
      - name: Format
        run: make fmt-check

      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --quiet --message-format=short -- -D warnings 2>&1 | tee clippy.log

      # GitHub 的 job 日志要仓库权限才能下载，但 annotation 是公开的。
      # 把失败输出打成 annotation，主控（或任何没有权限的人）也能看到具体错误。
      - name: Clippy errors as annotations
        if: failure()
        run: |
          head -20 clippy.log | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
          exit 0

      - name: Tests
        run: |
          set -o pipefail
          make test 2>&1 | tee /tmp/test.log

      # 测试失败时把日志写进 job summary 并留成 artifact：
      # 维护者没有 admin 权限读不到 raw log，只有这里能看到「哪个用例挂了」。
      - name: Test failure details
        if: failure()
        run: |
          if [ -f /tmp/test.log ]; then
            {
              echo "### 失败的测试输出（最后 200 行）"
              echo '```'
              tail -n 200 /tmp/test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/test.log
          if-no-files-found: warn

      # 安装脚本做的是卸载/升级/删数据这类破坏性操作，必须有自动化覆盖
      - name: Installer self-test
        run: make test-install

      - name: Web tests
        run: make web-test

      - name: Web build
        run: make web-build

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: End-to-end smoke
        run: |
          set -o pipefail
          ./scripts/e2e.sh 2>&1 | tee e2e.log

      - name: E2E errors as annotations
        if: failure()
        run: |
          if grep -q "Traceback" e2e.log; then
            awk '/Traceback/{f=1} f&&n<8{print; n++}' e2e.log > failures.txt
          elif grep -q "FAIL" e2e.log; then
            grep "FAIL" e2e.log | tail -4 > failures.txt
          else
            tail -6 e2e.log > failures.txt
          fi
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done < failures.txt
          exit 0
