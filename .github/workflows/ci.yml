name: CI

on:
  push:
    branches: [main]
  pull_request:
  # 手动触发时可以打开依赖扫描的阻塞开关（默认仍然只观察）。
  workflow_dispatch:
    inputs:
      audit_blocking:
        description: "依赖扫描发现漏洞时让 job 失败 / Fail the job on dependency audit findings"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 Makefile 保持一致：缓存落在仓库内，方便 actions/cache 命中
  CARGO_HOME: ${{ github.workspace }}/.cargo-home
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache

jobs:
  check:
    name: fmt + clippy + test + web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: .npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Frontend deps
        run: make web-install

      # 拆成独立 step：CI 上失败时能一眼看出是哪一环，不用翻日志
      - name: Format
        run: make fmt-check

      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --workspace --all-targets --quiet --message-format=short -- -D warnings 2>&1 | tee clippy.log

      # GitHub 的 job 日志要仓库权限才能下载，但 annotation 是公开的。
      # 把失败输出打成 annotation，主控（或任何没有权限的人）也能看到具体错误。
      - name: Clippy errors as annotations
        if: failure()
        run: |
          head -20 clippy.log | while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done
          exit 0

      - name: Tests
        run: |
          set -o pipefail
          make test 2>&1 | tee /tmp/test.log

      # 测试失败时把日志写进 job summary 并留成 artifact：
      # 维护者没有 admin 权限读不到 raw log，只有这里能看到「哪个用例挂了」。
      - name: Test failure details
        if: failure()
        run: |
          if [ -f /tmp/test.log ]; then
            {
              echo "### 失败的测试输出（最后 200 行）"
              echo '```'
              tail -n 200 /tmp/test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            # 把失败用例名写成 annotation：日志要权限，annotation 公开。
            grep -E "^(failures:|    [a-z0-9_:]+$)|panicked at|FAILED|^---- .* stdout ----" /tmp/test.log \
              | head -40 | while IFS= read -r line; do
                [ -n "$line" ] && echo "::error::${line}"
              done
            grep -B2 -A6 "panicked at" /tmp/test.log | head -60 | while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::${line}"
            done
          fi
          exit 0

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: /tmp/test.log
          if-no-files-found: warn

      # 依赖漏洞扫描：默认只观察（AUDIT_BLOCKING=0），发现漏洞也写 summary/annotation。
      # 安装失败不阻塞本轮：脚本会把它记成 scanner error，阻塞模式再一并失败。
      - name: Install cargo-audit
        continue-on-error: true
        run: |
          # .cargo-home 已被 actions/cache 缓存：命中时直接复用上次编译的二进制，
          # 避免每次都重新解析 index / 编译。
          if [ -x "$CARGO_HOME/bin/cargo-audit" ]; then
            echo "cargo-audit already present in the cargo cache"
          else
            cargo install cargo-audit --locked --root "$CARGO_HOME"
          fi

      - name: Dependency audit
        id: audit
        env:
          AUDIT_SUMMARY: ${{ runner.temp }}/audit-summary.md
          # 默认 0（观察期）。手动触发时勾选 audit_blocking 才变成 1。
          AUDIT_BLOCKING: ${{ github.event_name == 'workflow_dispatch' && inputs.audit_blocking == true && '1' || '0' }}
        run: |
          set -o pipefail
          rm -f "$AUDIT_SUMMARY" audit.log
          set +e
          ./scripts/audit.sh 2>&1 | tee audit.log
          status=${PIPESTATUS[0]}
          set -e

          findings=0
          if grep -q '^AUDIT_RESULT: findings' audit.log; then
            findings=1
          fi
          blocking_findings=$(awk -F': ' '/^AUDIT_BLOCKING_FINDINGS:/{print $2; exit}' audit.log)
          blocking_findings=${blocking_findings:-0}
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          echo "findings=${findings}" >> "$GITHUB_OUTPUT"
          echo "blocking_findings=${blocking_findings}" >> "$GITHUB_OUTPUT"

          # 把发现写成 annotation：日志要权限，annotation 公开。
          if grep -q '^AUDIT_FINDING:' audit.log; then
            grep '^AUDIT_FINDING:' audit.log | head -20 | while IFS= read -r line; do
              echo "::warning title=Dependency audit::${line#AUDIT_FINDING: }"
            done || true
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning title=Dependency audit::scanner exited with ${status}; see job summary"
          fi

          if [ -f "$AUDIT_SUMMARY" ]; then
            cat "$AUDIT_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 依赖扫描没有生成摘要 / no audit summary (scanner exit ${status})" >> "$GITHUB_STEP_SUMMARY"
          fi
          # 默认不阻塞；是否失败由下一步按 AUDIT_BLOCKING 决定。
          exit 0

      - name: Enforce dependency audit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.audit_blocking == true && (steps.audit.outputs.blocking_findings != '0' || steps.audit.outputs.status != '0') }}
        run: |
          echo "::error title=Dependency audit::AUDIT_BLOCKING=1 且依赖扫描发现漏洞或扫描失败，见 job summary"
          exit 1

      # 安装脚本做的是卸载/升级/删数据这类破坏性操作，必须有自动化覆盖
      - name: Installer self-test
        run: make test-install

      - name: Web tests
        run: make web-test

      - name: Web build
        run: make web-build

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: End-to-end smoke
        run: |
          set -o pipefail
          ./scripts/e2e.sh 2>&1 | tee e2e.log

      - name: E2E errors as annotations
        if: failure()
        run: |
          if grep -q "Traceback" e2e.log; then
            awk '/Traceback/{f=1} f&&n<8{print; n++}' e2e.log > failures.txt
          elif grep -q "FAIL" e2e.log; then
            grep "FAIL" e2e.log | tail -4 > failures.txt
          else
            tail -6 e2e.log > failures.txt
          fi
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done < failures.txt
          exit 0
