name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 Makefile 保持一致：缓存落在仓库内，方便 actions/cache 命中
  CARGO_HOME: ${{ github.workspace }}/.cargo-home
  NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm-cache

jobs:
  check:
    name: fmt + clippy + test + web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: .npm-cache
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-

      - name: Frontend deps
        run: make web-install

      # 拆成独立 step：CI 上失败时能一眼看出是哪一环，不用翻日志
      - name: Format
        run: make fmt-check

      - name: Clippy
        run: make clippy

      - name: Tests
        run: make test

      - name: Web build
        run: make web-build

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: End-to-end smoke
        run: make e2e
