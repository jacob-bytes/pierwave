name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_HOME: ${{ github.workspace }}/.cargo-home

jobs:
  linux:
    name: linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    env:
      # 放在 job 级：step 级 env 在 `if:` 里读不到
      PIERWAVE_RELEASE_SIGNING_KEY: ${{ secrets.PIERWAVE_RELEASE_SIGNING_KEY }}
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    steps:
      # 必须取全量历史与 tag 对象：浅克隆下 annotated tag 会退化成轻量 tag，
      # `git tag -l --format='%(contents)'` 拿到的就是 commit message 而不是发布说明。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # cross 用容器里的 musl 工具链，aarch64 也不用额外装链接器
      - uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            .cargo-home
            target
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: |
          cross build --release --locked --target ${{ matrix.target }} \
            -p pierwave-master -p pierwave-agent

      - name: Package
        run: |
          mkdir -p dist
          for bin in pierwave-master pierwave-agent; do
            cp "target/${{ matrix.target }}/release/$bin" "dist/$bin-${{ matrix.target }}"
          done
          (cd dist && sha256sum ./* > "SHA256SUMS-${{ matrix.target }}")
          ls -l dist

      # 上一次 v0.1.0 的 Linux 产物只有 5KB（链接参数是 macOS 专有的），
      # 发布出去却没人报错。加一道尺寸断言，宁可让 workflow 红。
      - name: Verify artifacts
        run: |
          for f in dist/pierwave-*; do
            size=$(stat -c%s "$f")
            file "$f" || true
            if [ "$size" -lt 500000 ]; then
              echo "::error::$f 只有 $size 字节，构建产物明显不完整"
              exit 1
            fi
          done

      # 对 SHA256SUMS 做 Ed25519 签名：只校验 sha256 挡不住「清单和二进制一起被改」。
      # 私钥放在仓库 Secret（PIERWAVE_RELEASE_SIGNING_KEY）里，公钥编译期内置。
      - name: Sign checksums
        if: env.PIERWAVE_RELEASE_SIGNING_KEY != ''
        run: |
          cargo build --release -p pierwave-master --locked
          sums="dist/SHA256SUMS-${{ matrix.target }}"
          ./target/release/pierwave-master sign-release "$PIERWAVE_RELEASE_SIGNING_KEY" "$sums" "$sums.sig"
          echo "signed: $sums.sig"
          ls -l dist

      # 发布说明直接用 annotated tag 的正文，格式在打 tag 时就被固定住：
      #   feat: ...
      #   fix: ...

      - name: Release notes from tag
        run: |
          # checkout 默认不拉 tag，浅克隆还会把 annotated tag 退化成轻量 tag，
          # 显式取一次 tag 对象，%(contents) 才是发布说明而不是 commit message。
          git fetch --tags --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > release-notes.md
          cat release-notes.md
          if ! grep -qE '^(feat|fix): ' release-notes.md; then
            echo "::error::发布说明必须是 annotated tag 的消息，且以 'feat: ' 或 'fix: ' 开头"
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
