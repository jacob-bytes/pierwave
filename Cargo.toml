[workspace]
resolver = "2"
members = ["crates/proto", "crates/domain", "crates/master", "crates/agent", "crates/mcp"]

[workspace.package]
version = "0.11.3"
edition = "2021"
license = "MIT"

[workspace.dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate", "macros"] }
argon2 = "0.5"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
flate2 = "1"
x25519-dalek = "2"
serde_yaml = "0.9"
tokio-tungstenite = "0.24"
toml = "0.8"
x509-parser = "0.18"
# TLS 探针：只用于 Agent 侧的真实握手观测。ring backend（不用 aws-lc）是为了
# 减轻 musl 静态构建负担；webpki-roots 保证与 realm/kaminari 用同一个信任根。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
strip = true
